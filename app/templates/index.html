```html
<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-300 antialiased selection:bg-blue-500/30">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uptime Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        .htmx-swapping { opacity: 0.6; transition: opacity 200ms ease-in-out; }
        #monitor-list { transition: opacity 200ms ease-in-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Premium Enterprise Banner -->
    <nav class="relative border-b border-slate-800/60 bg-slate-950 overflow-hidden shadow-2xl">

        <!-- Abstract gradient background -->
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between relative z-10">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20 border border-white/10">
                    <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>

                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Mission Control</h1>
                    <p class="text-xs text-slate-400 font-medium">Distributed Uptime Architecture</p>
                </div>
            </div>

            <!-- Live Worker Status Badge (Updates automatically) -->
            <div hx-get="/worker-status" hx-trigger="load, every 15s" class="hidden sm:block">
                <!-- Skeleton loader before the first HTMX request finishes -->
                <div class="animate-pulse h-8 w-32 bg-slate-900 rounded-full border border-slate-800"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-6 relative z-10">

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 shadow-sm">
            <form hx-post="/monitors" hx-target="#monitor-list" hx-swap="innerHTML" class="flex flex-col md:flex-row gap-2">

                <input
                    type="text"
                    name="name"
                    placeholder="Friendly Name (e.g. Production API)"
                    required
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                >

                <input
                    type="url"
                    name="url"
                    placeholder="https://..."
                    required
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                >

                <select
                    name="interval"
                    class="w-40 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all appearance-none cursor-pointer"
                >
                    <option value="15">15 Seconds</option>
                    <option value="60" selected>1 Minute</option>
                    <option value="300">5 Minutes</option>
                </select>

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-6 py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2"
                >
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Add Monitor
                </button>
            </form>
        </div>

        <div id="monitor-list" hx-get="/monitors/fragment" hx-trigger="every 5s" hx-swap="innerHTML transition:true">
            {% include "_monitor_list.html" %}
        </div>

    </main>

    <!-- This empty div is the target where the Edit Modal will render -->
    <div id="modal-container"></div>

</body>
</html>
```
