services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: 
      - "8000:8000"
    env_file: [.env]
    depends_on: 
      - db
      - redis

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    env_file: [.env]
    depends_on: 
      - db
      - redis

  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    env_file: [.env]
    depends_on: 
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: uptime_db
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: 
      - "6379:6379"

volumes:
  postgres_data: